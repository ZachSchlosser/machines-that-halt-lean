name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      - name: Fail if any proof is incomplete
        run: |
          if grep -rn "sorry" AlignmentUndecidability --include="*.lean"; then
            echo "::error::Found 'sorry' — proofs must be complete before merge"
            exit 1
          fi
